apiVersion: apps/v1
kind: Deployment
metadata:
  name: morphine-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: morphine-api
  template:
    metadata:
      labels:
        app: morphine-api
    spec:
      containers:
        - name: api
          image: morphine/api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: morphine-secrets
                  key: database_url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: morphine-secrets
                  key: jwt_secret_key
---
apiVersion: v1
kind: Service
metadata:
  name: morphine-api
spec:
  selector:
    app: morphine-api
  ports:
    - port: 8000
      targetPort: 8000
