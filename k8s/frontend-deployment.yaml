apiVersion: apps/v1
kind: Deployment
metadata:
  name: morphine-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: morphine-frontend
  template:
    metadata:
      labels:
        app: morphine-frontend
    spec:
      containers:
        - name: frontend
          image: morphine/frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: morphine-frontend
spec:
  selector:
    app: morphine-frontend
  ports:
    - port: 80
      targetPort: 80
